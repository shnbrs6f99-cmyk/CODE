[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interest-statement-generator-pro"
version = "1.0.0"
description = "Commercial Tally Prime ledger PDF interest statement generator for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pypdf>=5.1",
  "pdfplumber>=0.11.4",
  "openpyxl>=3.1.5",
  "customtkinter>=5.2.2",
  "platformdirs>=4.3.6",
  "pydantic>=2.10",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-openpyxl>=3.1.5",
  "pyinstaller>=6.11",
]

[project.scripts]
interest-statement-pro = "interest_statement_pro.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1 --cov=interest_statement_pro"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
