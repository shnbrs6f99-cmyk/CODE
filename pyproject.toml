[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interest-statement-generator-pro"
version = "1.0.0"
description = "Production-grade Tally Prime ledger PDF interest statement generator for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "customtkinter>=5.2",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyinstaller>=6.10",
]

[project.scripts]
interest-statement-pro = "interest_statement_pro.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
