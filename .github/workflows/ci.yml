name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check launcher.py src tests
      - name: Mypy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean InterestStatementGeneratorPro.spec
      - name: Launch packaged executable
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_packaged_executable.ps1
